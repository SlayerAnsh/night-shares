syntax = "proto3";

package night_shares.market.v1;

import "google/protobuf/timestamp.proto";
import "night_shares/identity/v1/identity.proto";
import "night_shares/auth/v1/access.proto";
import "night_shares/common/v1/money.proto";
import "night_shares/common/v1/night.proto";
import "night_shares/market/v1/analytics.proto";
import "night_shares/market/v1/book.proto";
import "night_shares/market/v1/portfolio.proto";

service MarketService {
  rpc LinkAgentPass(LinkAgentPassRequest) returns (LinkAgentPassResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc StartAgentCheckpoint(StartAgentCheckpointRequest) returns (StartAgentCheckpointResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc GetAgentCheckpoint(GetAgentCheckpointRequest) returns (GetAgentCheckpointResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc ClaimCutoff(ClaimCutoffRequest) returns (ClaimCutoffResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc ListCutoffClaims(ListCutoffClaimsRequest) returns (ListCutoffClaimsResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc PrepareAsk(PrepareAskRequest) returns (PrepareAskResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc CancelAllAsks(CancelAllAsksRequest) returns (CancelAllAsksResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc GetAgentWallet(GetAgentWalletRequest) returns (AgentWalletResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc FundAgentWallet(FundAgentWalletRequest) returns (AgentWalletResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc WithdrawAgentWallet(WithdrawAgentWalletRequest) returns (AgentWalletResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc SetAgentBudget(SetAgentBudgetRequest) returns (AgentWalletResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc Discover(DiscoverRequest) returns (DiscoverResponse) {
    option (night_shares.auth.v1.access) = ACCESS_PUBLIC;
  }
  rpc GetNight(GetNightRequest) returns (GetNightResponse) {
    option (night_shares.auth.v1.access) = ACCESS_PUBLIC;
  }
  rpc GetBook(GetBookRequest) returns (GetBookResponse) {
    option (night_shares.auth.v1.access) = ACCESS_PUBLIC;
  }
  rpc ListTape(ListTapeRequest) returns (ListTapeResponse) {
    option (night_shares.auth.v1.access) = ACCESS_PUBLIC;
  }
  rpc QuoteBuy(QuoteBuyRequest) returns (QuoteBuyResponse) {
    option (night_shares.auth.v1.access) = ACCESS_PUBLIC;
  }
  rpc QuoteSell(QuoteSellRequest) returns (QuoteSellResponse) {
    option (night_shares.auth.v1.access) = ACCESS_PUBLIC;
  }
  rpc Buy(BuyRequest) returns (BuyResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc Sell(SellRequest) returns (SellResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc PostAsk(PostAskRequest) returns (PostAskResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc CancelAsk(CancelAskRequest) returns (CancelAskResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc GetPortfolio(GetPortfolioRequest) returns (GetPortfolioResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc ToggleWatch(ToggleWatchRequest) returns (ToggleWatchResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc ListWatch(ListWatchRequest) returns (ListWatchResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc CreateAgentOrder(CreateAgentOrderRequest) returns (CreateAgentOrderResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
  rpc ApproveAgentOrder(ApproveAgentOrderRequest) returns (ApproveAgentOrderResponse) {
    option (night_shares.auth.v1.access) = ACCESS_ORB;
  }
}

message DiscoverRequest {
  string city = 1;
  DiscoverSort sort = 2;
  bool value_only = 3;
  bool soon = 4;
  bool watchlist = 5;
}

message DiscoverResponse {
  bool trading_paused = 2;
  repeated NightCard nights = 1;
}

message GetNightRequest {
  night_shares.common.v1.NightKey night = 1;
}

message GetNightResponse {
  bool trading_paused = 6;
  NightCard night = 1;
  NightStats stats = 2;
  repeated PricePoint price_history = 3;
  TrackRecord host_track_record = 4;
  repeated NightCard month_calendar = 5;
}

message GetBookRequest {
  night_shares.common.v1.NightKey night = 1;
}

message GetBookResponse {
  bool trading_paused = 8;
  repeated PublicHolder holders = 7;
  repeated BookLevel asks = 1;
  repeated BookLevel bids = 2;
  night_shares.common.v1.Usdc recall_cap = 3;
  night_shares.common.v1.Usdc fair_price = 4;
  int32 late_fee_bps = 5;
  google.protobuf.Timestamp release_at = 6;
}

message ListTapeRequest {
  night_shares.common.v1.NightKey night = 1;
}

message ListTapeResponse {
  repeated TapePrint prints = 1;
}

message QuoteBuyRequest {
  night_shares.common.v1.NightKey night = 1;
  night_shares.common.v1.RoomNights size = 2;
}

message QuoteBuyResponse {
  RouteQuote quote = 1;
}

message QuoteSellRequest {
  night_shares.common.v1.NightKey night = 1;
  night_shares.common.v1.RoomNights size = 2;
}

message QuoteSellResponse {
  RouteQuote quote = 1;
}

message BuyRequest {
  night_shares.common.v1.NightKey night = 1;
  night_shares.common.v1.RoomNights size = 2;
  night_shares.common.v1.Usdc max_total = 3;
}

message BuyResponse {
  Execution execution = 1;
}

message SellRequest {
  night_shares.common.v1.NightKey night = 1;
  night_shares.common.v1.RoomNights size = 2;
  night_shares.common.v1.Usdc min_total = 3;
}

message SellResponse {
  Execution execution = 1;
}

message PrepareAskRequest {
  night_shares.common.v1.NightKey night = 1;
  night_shares.common.v1.RoomNights size = 2;
  night_shares.common.v1.Usdc price = 3;
  google.protobuf.Timestamp expiry = 4;
}
message PrepareAskResponse {
  Ask order = 1;
  string typed_data_json = 2;
  string digest = 3;
}
message CancelAllAsksRequest {}
message CancelAllAsksResponse {
  uint64 nonce = 1;
  uint32 cancelled_count = 2;
}

message PostAskRequest {
  night_shares.common.v1.NightKey night = 1;
  night_shares.common.v1.RoomNights size = 2;
  night_shares.common.v1.Usdc price = 3;
  google.protobuf.Timestamp expiry = 4;
  optional uint64 nonce = 5;
  string signature = 6;
}

message PostAskResponse {
  Ask ask = 1;
  bool is_above_twice_fair = 2;
  bool is_above_recall_cap = 3;
}

message CancelAskRequest {
  string ask_id = 1;
}

message CancelAskResponse {}

message GetPortfolioRequest {}

message GetPortfolioResponse {
  repeated Holding holdings = 1;
  repeated Ask listings = 2;
  night_shares.common.v1.Usdc realised_pnl = 3;
  night_shares.common.v1.Usdc unrealised_pnl = 4;
  TraderTrackRecord track_record = 5;
  repeated AgentOrder agent_orders = 6;
  AgentWallet agent_wallet = 7;
  night_shares.common.v1.Usdc unclaimed_cutoff = 8;
}

message ToggleWatchRequest {
  night_shares.common.v1.NightKey night = 1;
}

message ToggleWatchResponse {
  bool is_watched = 1;
}

message ListWatchRequest {}

message ListWatchResponse {
  repeated NightCard nights = 1;
}

message CreateAgentOrderRequest {
  night_shares.common.v1.NightKey night = 1;
  night_shares.common.v1.RoomNights size = 2;
  night_shares.common.v1.Usdc budget = 3;
}

message CreateAgentOrderResponse {
  AgentOrder order = 1;
}

message ApproveAgentOrderRequest {
  string order_id = 1;
  string verification_token = 2;
}

message ApproveAgentOrderResponse {
  AgentOrder order = 1;
  Execution execution = 2;
}

// Agent holdings are attributed purchases within the shared human position.
message AgentWallet {
  bool agent_pass_linked = 8;
  string address = 1;
  night_shares.common.v1.Usdc balance = 2;
  night_shares.common.v1.Usdc total_budget = 3;
  night_shares.common.v1.Usdc per_order_cap = 4;
  night_shares.common.v1.Usdc spent = 5;
  repeated night_shares.common.v1.NightKey allowed_nights = 6;
  repeated Holding holdings = 7;
}
message AgentWalletResponse { AgentWallet wallet = 1; }
message GetAgentWalletRequest {}
message FundAgentWalletRequest { night_shares.common.v1.Usdc amount = 1; }
message WithdrawAgentWalletRequest { night_shares.common.v1.Usdc amount = 1; }
message SetAgentBudgetRequest {
  night_shares.common.v1.Usdc total_budget = 1;
  night_shares.common.v1.Usdc per_order_cap = 2;
  repeated night_shares.common.v1.NightKey allowed_nights = 3;
}


// Entitlements are fixed at release, pushed in batches, and claimable as fallback.
message CutoffClaim {
  night_shares.common.v1.NightKey night = 1;
  night_shares.common.v1.RoomNights size = 2;
  night_shares.common.v1.Usdc amount = 3;
  google.protobuf.Timestamp claimed_at = 4;
}
message ClaimCutoffRequest { night_shares.common.v1.NightKey night = 1; }
message ClaimCutoffResponse {
  CutoffClaim claim = 1;
  bool already_claimed = 2;
}
message ListCutoffClaimsRequest {}
message ListCutoffClaimsResponse { repeated CutoffClaim claims = 1; }

message StartAgentCheckpointRequest { string order_id = 1; }
message StartAgentCheckpointResponse {
  string authorize_url = 1;
  string attempt_id = 2;
  google.protobuf.Timestamp expires_at = 3;
  bool use_idkit = 4;
}
message GetAgentCheckpointRequest { string attempt_id = 1; }
message GetAgentCheckpointResponse {
  string status = 1;
  string reason = 2;
  string order_id = 3;
}

// An empty request starts a fresh Proof of Human action. Completion starts an
// enrollment-only Agent Pass checkpoint; it never approves an order.
message LinkAgentPassRequest {
  string request_id = 1;
  oneof proof {
    string mock_proof = 2;
    string idkit_result_json = 3;
  }
}
message LinkAgentPassResponse {
  night_shares.identity.v1.StartVerifyActionResponse verification = 1;
  StartAgentCheckpointResponse checkpoint = 2;
}
