syntax = "proto3";

package night_shares.identity.v1;

import "google/protobuf/timestamp.proto";
import "night_shares/auth/v1/access.proto";
import "night_shares/identity/v1/user.proto";

service IdentityService {
  rpc StartSignIn(StartSignInRequest) returns (StartSignInResponse) {
    option (night_shares.auth.v1.access) = ACCESS_PUBLIC;
  }
  rpc CompleteSignIn(CompleteSignInRequest) returns (CompleteSignInResponse) {
    option (night_shares.auth.v1.access) = ACCESS_PUBLIC;
  }
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option (night_shares.auth.v1.access) = ACCESS_DEVICE;
  }
  rpc SignOut(SignOutRequest) returns (SignOutResponse) {
    option (night_shares.auth.v1.access) = ACCESS_DEVICE;
  }
  rpc StartVerifyAction(StartVerifyActionRequest) returns (StartVerifyActionResponse) {
    option (night_shares.auth.v1.access) = ACCESS_DEVICE;
  }
  rpc VerifyAction(VerifyActionRequest) returns (VerifyActionResponse) {
    option (night_shares.auth.v1.access) = ACCESS_DEVICE;
  }
}

message StartSignInRequest {
  VerificationLevel level = 1;
  string session_id = 2;
}

message StartSignInResponse {
  string request_id = 1;
  string qr_payload = 2;
  google.protobuf.Timestamp expires_at = 3;
  string app_id = 4;
  string action = 5;
  string signal = 6;
  WorldIdMode mode = 7;
  WorldIdRequest context = 8;
}

message CompleteSignInRequest {
  string request_id = 1;
  reserved 2;
  reserved "proof";
  oneof proof {
    string mock_proof = 3;
    WorldIdProof world_id = 4;
    string idkit_result_json = 6;
  }
}

message CompleteSignInResponse {
  string session_token = 1;
  User user = 2;
  string session_id = 3;
}

message GetSessionRequest {}

message GetSessionResponse {
  User user = 1;
}

message SignOutRequest {}

message SignOutResponse {}

message VerifyActionRequest {
  string action = 1;
  string request_id = 5;
  reserved 2;
  reserved "proof";
  oneof proof {
    string mock_proof = 3;
    WorldIdProof world_id = 4;
    string idkit_result_json = 6;
  }
}

message VerifyActionResponse {
  string verification_token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// Enrollment uses a fixed action; sensitive actions use their own scope.
enum WorldIdMode {
  WORLD_ID_MODE_UNSPECIFIED = 0;
  WORLD_ID_MODE_MOCK = 1;
  WORLD_ID_MODE_WORLD_ID = 2;
}

message WorldIdProof {
  string merkle_root = 1;
  string nullifier_hash = 2;
  string proof = 3;
  string verification_level = 4;
}

message StartVerifyActionRequest {
  string action = 1;
  string resource_id = 2;
}

message StartVerifyActionResponse {
  string request_id = 1;
  string app_id = 2;
  string action = 3;
  string signal = 4;
  google.protobuf.Timestamp expires_at = 5;
  WorldIdMode mode = 6;
  WorldIdRequest context = 7;
}

// JSON preserves the complete vendor result without discarding credential fields.
message WorldIdRequest {
  string rp_id = 1;
  string nonce = 2;
  int64 created_at = 3;
  int64 expires_at = 4;
  string signature = 5;
  string session_id = 6;
  string environment = 7;
  bool allow_legacy = 8;
  string credential = 9;
  WorldIdRequest continuity = 10;
}
