syntax = "proto3";

package night_shares.wallet.v1;

import "night_shares/auth/v1/access.proto";
import "night_shares/common/v1/money.proto";
import "night_shares/wallet/v1/transaction.proto";

service WalletService {
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse) {
    option (night_shares.auth.v1.access) = ACCESS_DEVICE;
  }
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {
    option (night_shares.auth.v1.access) = ACCESS_DEVICE;
  }
}

message GetBalanceRequest {}

message GetBalanceResponse {
  night_shares.common.v1.Usdc balance = 1;
  string wallet_address = 2;
  // Absent when the optional Arc RPC read is unavailable.
  night_shares.common.v1.Usdc onchain_usdc_balance = 3;
  string explorer_url = 4;
  repeated SystemWallet system_wallets = 5;
}

message SystemWallet {
  string name = 1;
  string wallet_address = 2;
  string explorer_url = 3;
}

message ListTransactionsRequest {}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
}
