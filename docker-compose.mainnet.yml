# Deployable mainnet stack (Dokploy or `docker compose -f docker-compose.mainnet.yml up --build -d`).
# API runtime config and secrets come from ./.env (see .env.example).
# Dokploy writes its Environment tab to that file. Route a domain to
# service `web`, port 3000. No ports are published or exposed; services
# reach each other on the Compose network and cannot collide with Dokploy or other apps on the host.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      # Container layout. These override .env on purpose.
      PORT: "8787"
      DB_PATH: /data/night-shares.db
    volumes:
      - api-data:/data
    stop_grace_period: 15s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:8787
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  api-data:
