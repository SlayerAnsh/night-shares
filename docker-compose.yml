services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "8787"
      DB_PATH: /data/night-shares.db
      ADAPTERS: mock
      CORS_ORIGINS: http://localhost:3000
      TRUST_PROXY: "false"
    volumes:
      - api-data:/data
    ports:
      - "8787:8787"
    stop_grace_period: 15s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:8787
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  api-data:
